name: Deploy to Firebase Hosting

on:
  push:
    branches: [master]
  workflow_dispatch:

# Read the repo and open a failure issue.
permissions:
  contents: read
  issues: write

# Only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://activetogetheractivities.org
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9
          cache: true
          run_install: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm build

      # Deploys dist/ to the live channel (per firebase.json), which serves the
      # custom domain connected in the Firebase console.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIVE_TOGETHER_ACTIVITIES }}
          projectId: active-together-activities
          channelId: live

  # If the build or deploy fails, open (or comment on) a GitHub issue. Watching
  # the repo for Issues then emails the owner regardless of who pushed - the
  # built-in Actions email only reaches the person who triggered the run.
  notify-failure:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Site build/deploy is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Deploy to Firebase Hosting** workflow failed, so the site did not update.`,
              ``,
              `- Commit: ${context.sha}`,
              `- Triggered by: @${context.actor}`,
              `- Failed run: ${runUrl}`,
              ``,
              `Open the run above to see which step failed. This issue auto-closes once a deploy succeeds again.`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "build-failure",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["build-failure"],
              });
            }

  # On a successful deploy, close any open failure issue so it doesn't linger.
  notify-recovery:
    needs: [deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "build-failure",
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Deploy succeeded again on ${context.sha}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
