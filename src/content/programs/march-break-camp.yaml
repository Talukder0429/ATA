sections:
  - type: prose
    heading: Program Overview
    body: >
      Momentum March Break Camp is a full-week camp that gives students
      something exciting to look forward to during their school break. Each day
      features a different mix of sports, games, and special activities, so no
      two days feel the same. It's a chance to stay active, meet new people, and
      spend March Break doing something fun instead of staying home. Registration
      is now open — spaces are limited and fill on a first-come, first-served basis.
  # - type: cards
  #   heading: Why Families Choose Momentum March Break Camp
  #   items:
