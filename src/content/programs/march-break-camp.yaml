  #     - { icon: shield-check, title: Safe and inclusive environment }
  - type: checklist
    heading: What's Included
    items:
      - Five full days of programming
      - Sports equipment
      - Daily sports instruction
      - Team-building activities
      - Camp games and challenges
      - Friendly tournaments
      - Achievement awards
      - End-of-week celebration
  - type: prose
    heading: Camp Activities
    body: >
      Throughout the week, campers participate in a wide variety of sports and
      recreational activities, including soccer, basketball, volleyball,
      badminton, cricket, dodgeball, flag football, obstacle courses, relay
      races, fitness challenges, and team competitions. Special themed days and
      camp-wide events ensure that every day offers a new adventure.
  - type: table
    heading: Sample Camp Schedule
    note: This is just a sample schedule.
    columns: [ Day, Theme, Featured Activities ]
    rows:
      - cells: [ Monday, Welcome Day, "Icebreakers, team-building games, soccer, basketball" ]
      - cells: [ Tuesday, Skills & Challenge Day, "Sports clinics, relay races, fitness challenges" ]
      - cells: [ Wednesday, Adventure Day, "Multi-sport games, obstacle courses, scavenger hunt" ]
      - cells: [ Thursday, Tournament Day, "Team competitions, championship games, sports challenges" ]
      - cells: [ Friday, Celebration Day, "Camp Olympics, awards ceremony, fun activities, closing celebration" ]
  - type: checklist
    heading: What to Bring
    items:
      - Athletic clothing
      - Indoor running shoes
      - Water bottle
      - Nut-free lunch and snacks
      - Weather-appropriate outdoor clothing
      - Any required medication (administered per our medication policy)
  - type: prose
    heading: Safety
    body: >
      The safety and well-being of every camper is our highest priority. Our
      staff provide continuous supervision, secure attendance procedures, and a
      safe, welcoming environment where every participant is encouraged to
      learn, play, and have fun.
closing:
  heading: Ready for an Unforgettable March Break?
  text: Give your child a week filled with sports, friendships, and unforgettable memories.
