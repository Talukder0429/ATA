sections:
  - type: prose
    heading: Program Overview
    body: Weekend Sports Club is all about getting kids off the sidelines and into the game. Every weekend, participants take part in a variety of sports, skill-building activities, and friendly competitions that keep them moving and having fun. Whether they already love sports or are trying something new, everyone is welcome to join in.
  - type: cards
    heading: Age Divisions
    items:
      - title: Junior Division
        text: Grades 3-5
      - title: Intermediate Division
        text: Grades 6-8
  - type: pricing
    heading: Pricing
    items:
      - label: Monthly Membership
        price: $350/month per athlete
        includes:
          - Saturday & Sunday sports programming
          - 12:00 PM - 6:00 PM sessions
          - Multi-sport activities
          - Professional sports instruction
          - Skill development sessions
          - Recreational games
          - Friendly competitions
          - Mini tournaments
          - Leadership activities
          - Team-building exercises
          - Sports equipment provided
      - label: Single Day Registration
        price: $50/day per athlete
        note: Perfect for families who want flexibility and want to attend individual weekend sessions.
        includes:
          - Full 6-hour session
          - All activities and sports programming
          - Equipment provided
  - type: prose
    heading: Sports & Activities
    body: Participants rotate through a variety of sports and activities throughout the year, including soccer, basketball, volleyball, badminton, flag football, dodgeball, fitness challenges, and cooperative games. Regular tournaments and themed activity days keep every weekend exciting.
  - type: table
    heading: Weekend Program Schedule
    note: This is just a sample schedule.
    columns:
      - Day
      - Theme
      - Featured Activities
    rows:
      - cells:
          - Saturday
          - Skills & Development
          - Sport-specific training, drills, fitness, leadership activities
      - cells:
          - Sunday
          - Competition & Recreation
          - Friendly games, tournaments, multi-sport challenges, team competitions
  - type: checklist
    heading: What to Bring
    items:
      - Athletic clothing
      - Comfortable running shoes
      - Water bottle
      - Nut-free lunch and snacks
      - Weather-appropriate clothing for outdoor activities
  - type: prose
    heading: Safety
    body: The safety and well-being of every participant is our highest priority. Staff provide continuous supervision, maintain secure attendance procedures, and foster a respectful, inclusive environment where every participant can learn and have fun.
closing:
  heading: Ready to Join?
  text: Spend your weekends staying active, learning new skills, and making lasting friendships through sport.
  buttonLabel: Register Today
