      - [ Sunday, Competition & Recreation, "Friendly games, tournaments, multi-sport challenges, team competitions" ]
  - type: checklist
    heading: What to Bring
    items:
      - Athletic clothing
      - Comfortable running shoes
      - Water bottle
      - Nut-free lunch and snacks
      - Weather-appropriate clothing for outdoor activities
  - type: prose
    heading: Safety
    body: >
      The safety and well-being of every participant is our highest priority.
      Staff provide continuous supervision, maintain secure attendance
      procedures, and foster a respectful, inclusive environment where every
      participant can learn and have fun.
