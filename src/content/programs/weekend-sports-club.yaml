sections:
  - type: prose
    heading: Program Overview
    body: >
      Weekend Sports Club is all about getting kids off the sidelines and into
      the game. Every weekend, participants take part in a variety of sports,
      skill-building activities, and friendly competitions that keep them moving
      and having fun. Whether they already love sports or are trying something
      new, everyone is welcome to join in.
