  - type: prose
    heading: Sports & Activities
    body: >
      Participants rotate through a variety of sports and activities throughout
      the year, including soccer, basketball, volleyball, badminton, cricket,
      flag football, dodgeball, fitness challenges, and cooperative games.
      Regular tournaments and themed activity days keep every weekend exciting.
