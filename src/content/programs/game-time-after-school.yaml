  - type: prose
    heading: Sports and Activities
    body: >
      Every week, participants experience a mix of team sports, skill
      development, fitness activities, and recreational games designed to keep
      them active and engaged. Sports include soccer, basketball, volleyball,
      badminton, cricket, dodgeball, flag football, fitness challenges, and
      team-building activities. Throughout the year, participants also enjoy
      tournaments, themed events, and special activity days.
  - type: table
    heading: Weekly Program Schedule
    note: This is just a sample schedule.
    columns: [ Day, Theme, Featured Activities ]
    rows:
      - [ Monday, Team Sports, "Soccer, Basketball, Team-Building Games" ]
      - [ Tuesday, Skills Development, "Sport-specific drills, agility training, fitness challenges" ]
      - [ Wednesday, Competition Day, "Friendly matches, mini tournaments, relay races" ]
      - [ Thursday, Multi-Sport Adventure, "Volleyball, Badminton, Cricket, Dodgeball, Flag Football" ]
      - [ Friday, Fun Friday, "Championship games, obstacle courses, theme days, awards, recreation" ]
  - type: checklist
    heading: What to Bring
    items:
      - Athletic clothing
      - Comfortable running shoes
      - Water bottle
      - Nut-free snack (if desired)
      - Homework or reading materials (optional)
      - Weather-appropriate outerwear for outdoor activities
  - type: prose
    heading: Safety
    body: >
      The safety and well-being of every participant is our highest priority.
      Our staff provide daily supervision, attendance tracking, secure sign-in
      and sign-out procedures, and maintain a safe, inclusive environment where
      every child feels welcome and supported.
