sections:
  - type: prose
    heading: Program Overview
    body: >
      Game Time After School is an after-school sports program for students in
      Grades 3–12, running from September to June. It gives youth a fun, active
      place to spend their afternoons, where they can play sports, learn new
      skills, make friends, and stay engaged in a safe and supervised
      environment. Whether they're trying a sport for the first time or looking
      to improve their game, there's something for everyone.
