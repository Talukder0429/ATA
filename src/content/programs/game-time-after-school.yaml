sections:
  - type: prose
    heading: Program Overview
    body: Game Time After School is an after-school sports program for students in Grades 3–12, running from September to June. It gives youth a fun, active place to spend their afternoons, where they can play sports, learn new skills, make friends, and stay engaged in a safe and supervised environment. Whether they're trying a sport for the first time or looking to improve their game, there's something for everyone.
  - type: cards
    heading: Age Divisions
    items:
      - title: Junior Division
        text: Grades 3–5
      - title: Intermediate Division
        text: Grades 6–8
      - title: Senior Division
        text: Grades 9–12
  - type: pricing
    heading: Transportation & Pricing
    note: Which schools offer pickup is still to be decided.
    items:
      - label: Program + school pickup
        price: $400/month
        note: Daily transportation included
      - label: Program only
        price: $200/month
        note: Parent drop-off and pickup
  - type: checklist
    heading: What's Included
    items:
      - Professional sports instruction
      - Sports equipment
      - Daily supervised activities
      - Homework support
      - Leadership and teamwork activities
      - Friendly competitions
      - Monthly themed events
      - Achievement recognition
  - type: prose
    heading: Sports and Activities
    body: Every week, participants experience a mix of team sports, skill development, fitness activities, and recreational games designed to keep them active and engaged. Sports include soccer, basketball, volleyball, badminton, cricket, dodgeball, flag football, fitness challenges, and team-building activities. Throughout the year, participants also enjoy tournaments, themed events, and special activity days.
  - type: table
    heading: Weekly Program Schedule
    note: This is just a sample schedule.
    columns:
      - Day
      - Theme
      - Featured Activities
    rows:
      - cells:
          - Monday
          - Team Sports
          - Soccer, Basketball, Team-Building Games
      - cells:
          - Tuesday
          - Skills Development
          - Sport-specific drills, agility training, fitness challenges
      - cells:
          - Wednesday
          - Competition Day
          - Friendly matches, mini tournaments, relay races
      - cells:
          - Thursday
          - Multi-Sport Adventure
          - Volleyball, Badminton, Cricket, Dodgeball, Flag Football
      - cells:
          - Friday
          - Fun Friday
          - Championship games, obstacle courses, theme days, awards, recreation
  - type: checklist
    heading: What to Bring
    items:
      - Athletic clothing
      - Comfortable running shoes
      - Water bottle
      - Nut-free snack (if desired)
      - Homework or reading materials (optional)
      - Weather-appropriate outerwear for outdoor activities
  - type: prose
    heading: Safety
    body: The safety and well-being of every participant is our highest priority. Our staff provide daily supervision, attendance tracking, secure sign-in and sign-out procedures, and maintain a safe, inclusive environment where every child feels welcome and supported.
closing:
