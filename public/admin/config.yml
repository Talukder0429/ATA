# Sveltia CMS configuration.
# Docs: https://github.com/sveltia/sveltia-cms
#
# This maps the program YAML schema (see src/data/program-types.ts) to a
# form-based editor. Saving commits the edited file to `branch` on GitHub,
# which triggers the Pages deploy workflow (~1-2 min until live).

backend:
  name: github
  repo: Talukder0429/ATA
  branch: master
  # Token-only login: editors sign in with a GitHub Personal Access Token via
  # the "Sign In with Token" button. This needs no OAuth app and no OAuth client
  # server - the token is stored in the browser and used for API requests.
  # See public/admin/README.md for how editors generate a token.
  auth_methods: [token]

# Uploaded media lands here. Program images are currently external URLs, so
# this is only used if an editor uploads a file instead of pasting a URL.
media_folder: public/uploads
public_folder: /ATA/uploads

# Show a diff-style preview of pending changes before publishing.
publish_mode: simple

# Disable the built-in live preview pane. Sveltia's generic preview can't render
# the site's real React components / Markdown, so it's misleading. The true
# preview is the deployed site after publishing.
editor:
  preview: false

collections:
  - name: programs
    label: Programs
    label_singular: Program
    description: >
      Each program is one file. "Display order" controls ordering; set
      "Status" to draft or hidden to keep a program off the live site.
    folder: src/content/programs
    extension: yaml
    format: yaml
    create: true
    delete: true
    editor:
      preview: false
    # Filename = slug. Lowercased, spaces to dashes, matching existing files.
    slug: '{{fields.name | lower | replace(" ", "-") | replace("&", "and")}}'
    identifier_field: name
    summary: '{{fields.name}} - {{fields.status}} (order {{fields.order}})'
    fields:
      - name: status
        label: Status
        widget: select
        options: [published, hidden, draft]
        default: published
        hint: Only "published" programs appear on the live site.

      - name: order
        label: Display order
        widget: number
        value_type: int
        default: 1
        hint: Lower numbers appear first.

      - { name: name, label: Program name, widget: string }
      - { name: tagline, label: Tagline, widget: string, required: false }
      - { name: subtitle, label: Subtitle, widget: string, required: false }

      - name: cardSummary
        label: Card summary
        widget: text
        hint: Short blurb shown on the programs listing card.

      - name: cardImage
        label: Card image
        widget: image
        required: false
        choose_url: true
        hint: Upload an image or paste a hosted https:// URL. Shown on the listing card.

      - name: heroImage
        label: Hero image
        widget: image
        required: false
        choose_url: true
        hint: Upload or paste a URL. Falls back to the card image if empty.

      - name: registrationLabel
        label: Register button label
        widget: string
        required: false
        default: Register Now

      - name: quickFacts
        label: Quick facts
        label_singular: Fact
        widget: list
        required: false
        summary: '{{fields.label}}: {{fields.value}}'
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }

      - name: sections
        label: Content sections
        label_singular: Section
        widget: list
        required: false
        types:
          - name: prose
            label: Prose (paragraph)
            summary: 'Prose: {{fields.heading}}'
            fields:
              - { name: heading, label: Heading, widget: string, required: false }
              - name: body
                label: Body
                widget: markdown
                minimal: true
                hint: Supports Markdown (bold, links, lists).

          - name: checklist
            label: Checklist
            summary: 'Checklist: {{fields.heading}}'
            fields:
              - { name: heading, label: Heading, widget: string, required: false }
              - name: items
                label: Items
                widget: list
                field: { name: item, label: Item, widget: string }

          - name: cards
            label: Cards
            summary: 'Cards: {{fields.heading}}'
            fields:
              - { name: heading, label: Heading, widget: string, required: false }
              - name: items
                label: Cards
                label_singular: Card
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - name: icon
                    label: Icon
                    widget: select
                    required: false
                    options:
                      - activity
                      - award
                      - book-open
                      - bus
                      - check
                      - heart
                      - layers
                      - shield-check
                      - sun
                      - trophy
                      - users
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: string, required: false }

          - name: table
            label: Table
            summary: 'Table: {{fields.heading}}'
            fields:
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: note, label: Note, widget: string, required: false }
              - name: columns
                label: Column headers
                widget: list
                field: { name: column, label: Column, widget: string }
              - name: rows
                label: Rows
                label_singular: Row
                widget: list
                summary: '{{fields.cells}}'
                fields:
                  - name: cells
                    label: Cells (one per column, in order)
                    widget: list
                    field: { name: cell, label: Cell, widget: string }

          - name: pricing
            label: Pricing
            summary: 'Pricing: {{fields.heading}}'
            fields:
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: note, label: Note, widget: string, required: false }
              - name: items
                label: Tiers
                label_singular: Tier
                widget: list
                summary: '{{fields.label}} - {{fields.price}}'
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: price, label: Price, widget: string }
                  - { name: note, label: Note, widget: string, required: false }

      - name: closing
        label: Closing call-to-action
        widget: object
        required: false
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: buttonLabel, label: Button label, widget: string, required: false }
